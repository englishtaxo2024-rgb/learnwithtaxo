name: Deploy Hostinger Static

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -f dist/assets/no
          test -f dist/assets/logo.png
          test -d dist/assets/visuals/general
          test -d dist/assets/visuals/kids-course
          test -d dist/assets/visuals/kids-phonics
          test -f dist/assets/visuals/general/hero-student-learning.png
          test -f dist/assets/visuals/kids-course/kids-speaking-lesson.png
          test -f dist/assets/visuals/kids-phonics/phonics-reading-corner.png
          find dist/assets -type f | grep -E '\.(js|css)$'
          ls -la dist
          ls -la dist/assets
          find dist/assets/visuals -maxdepth 2 -type f | head -40

      - name: Deploy dist to hostinger-static
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-static
          publish_dir: ./dist
          force_orphan: true
          keep_files: false

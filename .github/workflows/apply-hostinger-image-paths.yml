name: Apply Hostinger Image Paths

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-hostinger-image-paths.mjs
      - scripts/run-hostinger-image-migration.mjs
      - .github/workflows/apply-hostinger-image-paths.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-image-path-migration
  cancel-in-progress: true

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply and verify Hostinger image paths
        run: node scripts/run-hostinger-image-migration.mjs

      - name: Commit source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/data/visualAssets.js
          git diff --cached --quiet || git commit -m "Update landing page visual assets"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          find dist/assets -type f | grep -E '\.(js|css)$'

      - name: Deploy dist to hostinger-static
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-static
          publish_dir: ./dist
          force_orphan: true
          keep_files: false

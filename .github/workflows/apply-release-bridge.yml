name: Apply release bridge

on:
  push:
    branches:
      - codex/release-bridge-bbd6507
    paths:
      - .github/workflows/apply-release-bridge.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release bridge
        uses: actions/checkout@v4
        with:
          ref: codex/release-bridge-bbd6507
          path: bridge

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: release

      - name: Reconstruct release patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const base = 'bridge/.release-bridge';
          const chunks = [1, 2, 3, 4, 5].map((number) =>
            fs.readFileSync(`${base}/chunk-${String(number).padStart(2, '0')}.txt`, 'utf8')
          );

          if (chunks[0].length !== 39001 || chunks[0][25590] !== '7') {
            throw new Error('Unexpected chunk-01 transfer state');
          }
          chunks[0] = chunks[0].slice(0, 25590) + chunks[0].slice(25591);

          if (chunks[2].length !== 39000 || chunks[2][31377] !== 't') {
            throw new Error('Unexpected chunk-03 transfer state');
          }
          chunks[2] = chunks[2].slice(0, 31377) + 'T' + chunks[2].slice(31378);

          const encoded = chunks.join('').replace(/\s+/g, '');
          const patch = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));
          fs.writeFileSync('/tmp/release.patch', patch);
          NODE
          echo "e59805c86995bba03af37e532b0ed912ff12fac15b72b5a8819511a79a4bad75  /tmp/release.patch" | sha256sum --check

      - name: Apply release patch
        shell: bash
        run: |
          cd release
          git config user.name "englishtaxo2024-rgb"
          git config user.email "englishtaxo2024@gmail.com"
          git am /tmp/release.patch

      - name: Publish release candidate
        shell: bash
        run: |
          cd release
          git push --force origin HEAD:refs/heads/codex/release-candidate-bbd6507

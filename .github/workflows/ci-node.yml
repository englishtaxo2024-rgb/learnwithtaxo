name: Verify Node Web App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: |
          find server -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        run: npm run build

      - name: Verify Node entry and SPA output
        run: |
          test -f server/index.js
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets

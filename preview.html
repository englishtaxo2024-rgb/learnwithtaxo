<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn with Taxo Preview Removed</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061B30,#0B2A4A);color:white;font-family:Inter,Segoe UI,Arial,sans-serif;padding:24px}.card{max-width:760px;border:1px solid rgba(195,225,245,.18);border-radius:10px;background:rgba(255,255,255,.075);padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28)}img{height:86px;max-width:320px;object-fit:contain}.gold{color:#D4AF37}.muted{color:#C3E1F5;line-height:1.7}.code{display:block;margin:12px 0;border-radius:8px;background:rgba(0,0,0,.25);padding:14px;color:#C3E1F5;font-family:Consolas,monospace}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/assets/logo.png" alt="Learn with Taxo logo" />
      <h1>Static preview removed</h1>
      <p class="muted">The production Learn with Taxo portal is a full-stack Node/Vite app. Deploy it through Hostinger Node.js Web App hosting, not static hosting.</p>
      <p class="gold">Manual payment confirmation only. No payment gateway checkout is used.</p>
      <span class="code">Build: npm run build</span>
      <span class="code">Start: npm start</span>
      <span class="code">Entry: server/index.js</span>
    </main>
  </body>
</html>
